services:
  - type: web
    name: bitrix24-bot
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn address_ai.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BITRIX_AUTOMATION_MODE
        value: live
      - key: BITRIX_ASSIGNMENT_STAGE_ID
        value: C16:UC_GIKKS8
      - key: BITRIX_CATEGORY_ID
        value: "16"
      - key: BITRIX_OPERATOR_USER_ID
        value: "2381716"
      - key: BITRIX_TARGET_STAGE_ID
        value: C16:UC_L8W7U1
      - key: BITRIX_GREETING_MESSAGE
        value: "Hola, buen día soy José Pecina de Megacable, para confirmar cobertura y promociones me puede brindar de su domicilio: Calle y número, Colonia, Código postal\\n\\n¿es la primera vez que contrata Megacable en el domicilio?"
      - key: BITRIX_SCAN_ENABLED
        value: "true"
      - key: BITRIX_SCAN_INTERVAL_SECONDS
        value: "5"
      - key: BITRIX_SCAN_LIMIT
        value: "8"
